# ToolConfig: served at /toolconfig/ next to Mainsail.
# Included from the Mainsail server block (/etc/nginx/sites-available/mainsail).
# @REPO@ is replaced with the clone's path when installing.
location /toolconfig/ {
    alias @REPO@/web/dist/;
    index index.html;
}
location = /toolconfig/index.html {
    alias @REPO@/web/dist/index.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
}
# Old address (the project used to be called klipper-toolchanger-ui)
location /toolchanger/ {
    return 301 /toolconfig/;
}
