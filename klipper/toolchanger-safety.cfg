# =============================================================================
#  toolchanger-safety.cfg  -  part of ToolConfig
#
#  Safe failure handling, a dock "test mode", and fixed alignment macros for
#  klipper-toolchanger-easy or viesturz/klipper-toolchanger, with per-tool
#  probes (TAP / OptoTap) or detection pins.
#
#  Include this AFTER the toolchanger include in printer.cfg (easy shown;
#  with upstream, after your toolchanger and tool configs):
#     [include toolchanger/readonly-configs/toolchanger-include.cfg]
#     [include toolchanger/toolchanger-safety.cfg]
#
#  What it changes compared to the stock easy-additions configs:
#   * A failed pickup no longer runs M112 (emergency stop). The toolchanger is
#     put into its error state, the gantry backs out of the dock along the
#     dock path, and the printer stays homed. Mid-print it then PAUSEs.
#   * The tool-drop crash handler no longer runs M84, so homing is kept.
#   * An empty gantry is allowed (require_tool_present: False) so you can
#     recover with TC_RETRY_PICKUP instead of restarting Klipper.
#   * TC_TEST_MODE / TC_TEST_DOCK let you dock/undock a tool repeatedly at
#     reduced speed; failures are counted and reported, never fatal.
#   * TOOL_ALIGN_* work with docks at any Y, use real toolhead coordinates,
#     and enter docking mode properly.
# =============================================================================

# Python helper from this repo (klipper/extras/toolchanger_ui.py)
[toolchanger_ui]

[toolchanger]
require_tool_present: False
error_gcode:
  _TC_ON_ERROR T={ tool.get('tool_number', -1) if tool else -1 }

# crash_gcode of [tool_probe_endstop] is set to _TC_ON_CRASH by toolchanger_ui
# (a section here would clash with setups where the toolchanger owns the
# probes). Override with `crash_gcode:` under [toolchanger_ui].

# -----------------------------------------------------------------------------
#  State shared with the web UI (read via printer["gcode_macro _TC_SAFETY"])
# -----------------------------------------------------------------------------
[gcode_macro _TC_SAFETY]
description: Toolchanger safety/test state (read by the toolchanger UI)
variable_version: 1
variable_test_mode: False
variable_test_speed_factor: 0.35   # path speed multiplier while in test mode
variable_test_running: False
variable_test_tool: -1
variable_test_pass: 0
variable_test_fail: 0
variable_last_error: ''
variable_last_error_tool: -1
variable_fail_count: 0
gcode:
  RESPOND MSG="toolchanger-safety v{version}: test_mode={test_mode} last_error={last_error}"

# -----------------------------------------------------------------------------
#  Detection check (called by VERIFY_TOOL_DETECTED). Replaces the stock
#  version, which ran M112 and had a broken "T in params" check.
# -----------------------------------------------------------------------------
[gcode_macro _STOP_IF_INCORRECT_TOOL]
gcode:
  {% set detected = printer.toolchanger_ui.detected_tool|int %}
  {% set q = printer.toolchanger_ui.probes %}
  {% set ns = namespace(states='') %}
  {% for k in q %}
    {% set ns.states = ns.states ~ (', ' if ns.states else ' ') ~ 'T' ~ k ~ (' in dock' if q[k] else ' ON GANTRY') %}
  {% endfor %}
  {% if 'T' in params %}
    {% set expected = params.T|int %}
  {% else %}
    {% set expected = printer.toolchanger.tool_number|int %}
  {% endif %}
  {% if detected == -1 %}
    _TC_FAIL T={expected} MSG="No tool detected on the gantry (expected T{expected}). Sensors say:{ns.states}"
  {% elif expected >= 0 and detected != expected %}
    _TC_FAIL T={expected} MSG="Wrong tool detected: expected T{expected}, found T{detected}. Sensors say:{ns.states}"
  {% endif %}

[gcode_macro _TC_FAIL]
description: Record a tool change failure and hand it to the toolchanger error path (no M112)
gcode:
  {% set s = printer["gcode_macro _TC_SAFETY"] %}
  {% set msg = params.MSG|default('Tool change failed')|replace("'", "")|replace('"', '') %}
  SET_GCODE_VARIABLE MACRO=_TC_SAFETY VARIABLE=last_error VALUE='"{msg}"'
  SET_GCODE_VARIABLE MACRO=_TC_SAFETY VARIABLE=last_error_tool VALUE={params.T|default(-1)|int}
  SET_GCODE_VARIABLE MACRO=_TC_SAFETY VARIABLE=fail_count VALUE={s.fail_count + 1}
  {% if s.test_running %}
    SET_GCODE_VARIABLE MACRO=_TC_SAFETY VARIABLE=test_fail VALUE={s.test_fail + 1}
    SET_GCODE_VARIABLE MACRO=_TC_SAFETY VARIABLE=test_running VALUE=False
  {% endif %}
  {% if printer.toolchanger.status in ['changing', 'initializing'] %}
    RESPOND TYPE=error MSG="{msg}"
    # Puts the toolchanger in 'error', runs error_gcode (_TC_ON_ERROR) and
    # aborts the rest of the tool change. Motors and homing are untouched.
    SELECT_TOOL_ERROR MESSAGE="{msg}"
  {% else %}
    TC_RAISE MSG="{msg}"
  {% endif %}

# -----------------------------------------------------------------------------
#  error_gcode: back out of the dock, then pause (if printing, not testing)
# -----------------------------------------------------------------------------
[gcode_macro _TC_ON_ERROR]
gcode:
  {% set s = printer["gcode_macro _TC_SAFETY"] %}
  {% set tn = params.T|default(-1)|int %}
  {% if tn >= 0 %}
    _TC_BACK_OUT T={tn}
  {% endif %}
  {% if printer.print_stats.state == 'printing' and not s.test_mode %}
    RESPOND TYPE=error MSG="Tool change failed - pausing. Fix the tool, then use TC_RETRY_PICKUP T={tn} and RESUME."
    PAUSE
  {% else %}
    RESPOND TYPE=error MSG="Tool change failed - printer is still homed. Adjust, then TC_RETRY_PICKUP T={tn}."
  {% endif %}

[gcode_macro _TC_BACK_OUT]
description: If the gantry is inside a tool's dock, leave it the way a dropoff does
gcode:
  {% set t = printer['tool T' ~ params.T] %}
  {% set pos = printer.toolhead.position %}
  {% set o = printer.gcode_move.homing_origin %}
  {% set x = pos.x - o.x %}
  {% set y = pos.y - o.y %}
  {% set z = pos.z - o.z %}
  {% set path = t.params_pickup_path %}
  # pickup path [0] = approach point, [1] = under the tool (same as the end of a dropoff)
  {% set drop_z = t.params_park_z|float + path[1].get('z', 0)|float %}
  {% set exit_y = t.params_park_y|float + path[0].get('y', 0)|float %}
  {% set speed = t.params_path_speed|float %}
  {% set near_x = (x - t.params_park_x|float)|abs < 3.0 %}
  # Seated: gantry is where it latches the tool (within 2mm of park Y)
  {% set seated = near_x and y < t.params_park_y|float + 2.0 and z > drop_z - 1.0 %}
  # In front of the dock (e.g. at the end of the pickup path)
  {% set in_front = near_x and y < t.params_safe_y|float and z > drop_z - 1.0 %}
  {% if seated %}
    RESPOND MSG="Backing out of the T{params.T} dock"
    SAVE_GCODE_STATE NAME=_tc_back_out
    G91
    {% if z > drop_z + 0.05 %}
      G0 Z{drop_z - z} F{speed}
    {% endif %}
    G0 Y{exit_y - y} F{speed}
    G0 Y{[t.params_safe_y|float - exit_y, 0]|max} F{t.params_fast_speed}
    RESTORE_GCODE_STATE NAME=_tc_back_out MOVE=0
  {% elif in_front %}
    # Same move a normal pickup makes next: straight out to safe Y
    RESPOND MSG="Moving away from the T{params.T} dock"
    SAVE_GCODE_STATE NAME=_tc_back_out
    G91
    G0 Y{[t.params_safe_y|float - y, 0]|max} F{speed}
    RESTORE_GCODE_STATE NAME=_tc_back_out MOVE=0
  {% else %}
    RESPOND MSG="Not inside the T{params.T} dock (X{x|round(1)} Y{y|round(1)} Z{z|round(1)}) - not moving"
  {% endif %}

# -----------------------------------------------------------------------------
#  Tool-drop crash detection (tool probe opened while printing)
# -----------------------------------------------------------------------------
[gcode_macro _TC_ON_CRASH]
gcode:
  {% set s = printer["gcode_macro _TC_SAFETY"] %}
  {% set tn = printer.toolchanger.tool_number %}
  {% set msg = 'Tool T' ~ tn ~ ' probe triggered while printing - possible tool drop or crash' %}
  SET_GCODE_VARIABLE MACRO=_TC_SAFETY VARIABLE=last_error VALUE='"{msg}"'
  SET_GCODE_VARIABLE MACRO=_TC_SAFETY VARIABLE=last_error_tool VALUE={tn}
  RESPOND TYPE=error MSG="{msg}"
  {% if printer.print_stats.state == 'printing' and not s.test_mode %}
    PAUSE
    # Hotends off (a dropped hot tool is a hazard); bed stays on so the part
    # stays stuck down. Motors stay enabled so homing is kept.
    {% for name in printer.toolchanger.tool_names %}
      {% if printer[name].extruder %}
        SET_HEATER_TEMPERATURE HEATER={printer[name].extruder} TARGET=0
      {% endif %}
    {% endfor %}
  {% endif %}

# -----------------------------------------------------------------------------
#  Initialization: allow an empty gantry instead of failing / pausing
# -----------------------------------------------------------------------------
[gcode_macro _INITIALIZE_FROM_DETECTED_TOOL_IMPL]
gcode:
  {% set detected = printer.toolchanger_ui.detected_tool|int %}
  {% if detected == -1 %}
    RESPOND TYPE=error MSG="No tool detected on the gantry - toolchanger initialized with no tool. Pick one up with T<n> or TC_RETRY_PICKUP T=<n>."
    {% if printer.toolchanger.status != 'changing' %}
      # A failed pickup leaves the toolchanger pointing at the tool it tried
      # to pick up; forget it so the next T<n> really picks it up.
      TC_CLEAR_ACTIVE_TOOL
    {% endif %}
    INITIALIZE_TOOLCHANGER_ORIG
  {% else %}
    INITIALIZE_TOOLCHANGER_ORIG T={detected}
  {% endif %}

# -----------------------------------------------------------------------------
#  Recovery
# -----------------------------------------------------------------------------
[gcode_macro TC_RECOVER]
description: Re-detect the tool on the gantry and clear the toolchanger error (no restart, keeps homing)
gcode:
  {% if printer.toolchanger.status == 'changing' %}
    EXIT_DOCKING_MODE
  {% endif %}
  INITIALIZE_TOOLCHANGER
  SET_GCODE_VARIABLE MACRO=_TC_SAFETY VARIABLE=last_error VALUE='""'
  SET_GCODE_VARIABLE MACRO=_TC_SAFETY VARIABLE=last_error_tool VALUE=-1

[gcode_macro TC_RETRY_PICKUP]
description: Recover, then pick up tool T (stays at the dock's safe Y afterwards)
gcode:
  {% if 'T' not in params %}
    TC_RAISE MSG="TC_RETRY_PICKUP needs a tool number, e.g. TC_RETRY_PICKUP T=1"
  {% else %}
    TC_RECOVER
    _TC_RETRY_PICKUP_2 T={params.T}
  {% endif %}

[gcode_macro _TC_RETRY_PICKUP_2]
gcode:
  {% if printer.toolchanger.tool_number|int != params.T|int %}
    SELECT_TOOL T={params.T} RESTORE_AXIS=
    _TC_ABORT_IF_ERROR
  {% else %}
    RESPOND MSG="T{params.T} is already on the gantry"
  {% endif %}

[gcode_macro _TC_ABORT_IF_ERROR]
description: SELECT_TOOL swallows pickup errors (to keep prints alive); stop the calling macro here instead
gcode:
  {% if printer.toolchanger.status == 'error' %}
    TC_RAISE MSG="Tool change failed: {printer['gcode_macro _TC_SAFETY'].last_error}"
  {% endif %}

[gcode_macro TC_BACK_OUT]
description: Move the gantry out of tool T's dock (only moves if it is inside it)
gcode:
  _TC_BACK_OUT T={params.T|default(printer["gcode_macro _TC_SAFETY"].last_error_tool)}

# -----------------------------------------------------------------------------
#  Test mode
# -----------------------------------------------------------------------------
[gcode_macro TC_TEST_MODE]
description: ENABLE=1 slows dock moves and makes failures report-only; ENABLE=0 restores
gcode:
  {% set s = printer["gcode_macro _TC_SAFETY"] %}
  {% set enable = params.ENABLE|default(1)|int == 1 %}
  {% set factor = params.SPEED|default(s.test_speed_factor)|float %}
  {% for name in printer.toolchanger.tool_names %}
    {% set tn = printer[name].tool_number %}
    {% if enable %}
      SET_TOOL_PARAMETER T={tn} PARAMETER=params_path_speed VALUE={printer.toolchanger.params_path_speed|float * factor}
    {% else %}
      RESET_TOOL_PARAMETER T={tn} PARAMETER=params_path_speed
    {% endif %}
  {% endfor %}
  SET_GCODE_VARIABLE MACRO=_TC_SAFETY VARIABLE=test_speed_factor VALUE={factor}
  SET_GCODE_VARIABLE MACRO=_TC_SAFETY VARIABLE=test_mode VALUE={enable}
  {% if enable %}
    SET_GCODE_VARIABLE MACRO=_TC_SAFETY VARIABLE=test_pass VALUE=0
    SET_GCODE_VARIABLE MACRO=_TC_SAFETY VARIABLE=test_fail VALUE=0
  {% endif %}
  RESPOND MSG="Toolchanger test mode {'ON - dock moves at ' ~ (factor * 100)|int ~ '% speed, failures will not pause or stop' if enable else 'OFF'}"

[gcode_macro TC_TEST_DOCK]
description: T=<n> [CYCLES=1] - drop off and pick up tool T in its own dock, verifying each pickup
gcode:
  {% if 'T' not in params %}
    TC_RAISE MSG="TC_TEST_DOCK needs a tool number, e.g. TC_TEST_DOCK T=1"
  {% elif printer.toolhead.homed_axes != 'xyz' %}
    TC_RAISE MSG="Home the printer first (G28)"
  {% else %}
    {% set tn = params.T|int %}
    {% set cycles = params.CYCLES|default(1)|int %}
    SET_GCODE_VARIABLE MACRO=_TC_SAFETY VARIABLE=test_tool VALUE={tn}
    SET_GCODE_VARIABLE MACRO=_TC_SAFETY VARIABLE=test_running VALUE=True
    {% if printer.toolchanger.status != 'ready' %}
      TC_RECOVER
    {% endif %}
    _TC_TEST_SELECT T={tn}
    {% for i in range(cycles) %}
      RESPOND MSG="Dock test T{tn}: cycle {i + 1} of {cycles}"
      ENTER_DOCKING_MODE
      TEST_TOOL_DOCKING RESTORE_AXIS=
      EXIT_DOCKING_MODE
      VERIFY_TOOL_DETECTED T={tn}
      _TC_TEST_PASSED
    {% endfor %}
    SET_GCODE_VARIABLE MACRO=_TC_SAFETY VARIABLE=test_running VALUE=False
    RESPOND MSG="Dock test T{tn}: all {cycles} cycle(s) passed"
  {% endif %}

[gcode_macro _TC_TEST_SELECT]
gcode:
  {% if printer.toolchanger.tool_number|int != params.T|int %}
    SELECT_TOOL T={params.T} RESTORE_AXIS=
    _TC_ABORT_IF_ERROR
    _TC_TEST_PASSED
  {% endif %}

[gcode_macro _TC_TEST_PASSED]
gcode:
  {% set s = printer["gcode_macro _TC_SAFETY"] %}
  SET_GCODE_VARIABLE MACRO=_TC_SAFETY VARIABLE=test_pass VALUE={s.test_pass + 1}

# -----------------------------------------------------------------------------
#  Dock alignment (replaces TOOL_ALIGN_* from toolchanger.cfg)
#    1. TOOL_ALIGN_START        - enters docking mode, moves in front of the dock
#    2. jog the gantry until the tool sits correctly in its dock
#    3. TOOL_ALIGN_TEST         - uses the current position, docks + picks up
#    4. repeat 2-3, then TOOL_ALIGN_DONE (or TOOL_ALIGN_CANCEL)
#  New park positions are live immediately. Save them from the toolchanger UI
#  (writes Tn.cfg, no restart) or with TOOL_ALIGN_DONE PERSIST=1 (SAVE_CONFIG).
# -----------------------------------------------------------------------------
[gcode_macro _TOOL_ALIGN_START]
gcode:
  {% set tool = printer[printer.toolchanger.tool] %}
  SET_TOOL_PARAMETER PARAMETER='params_path_speed' VALUE=300
  SET_GCODE_OFFSET X=0 Y=0 Z=0
  ENTER_DOCKING_MODE
  {% set entry_z = tool.params_park_z|float + tool.params_dropoff_path[0].get('z', 0)|float %}
  G90
  G0 Y{tool.params_safe_y} F{tool.params_fast_speed}
  G0 X{tool.params_park_x} Z{entry_z} F{tool.params_fast_speed}
  G0 Y{[tool.params_park_y|float + 30.0, tool.params_safe_y|float]|min} F{tool.params_fast_speed}
  RESPOND MSG="Jog {tool.name} into its dock (seated, as if just picked up), then run TOOL_ALIGN_TEST"

[gcode_macro TOOL_ALIGN_TEST]
gcode:
  {% set tool = printer[printer.toolchanger.tool] if printer.toolchanger.tool else {} %}
  {% set pos = printer.toolhead.position %}
  {% set o = printer.gcode_move.homing_origin %}
  {% set x = (pos.x - o.x)|round(3) %}
  {% set y = (pos.y - o.y)|round(3) %}
  {% set z = (pos.z - o.z)|round(3) %}
  {% if printer.toolchanger.status != 'changing' or not tool %}
    TC_RAISE MSG="Run TOOL_ALIGN_START first"
  {% else %}
    {% set dist = [ (x - tool.params_park_x|float)|abs, (y - tool.params_park_y|float)|abs, (z - tool.params_park_z|float)|abs ]|max %}
    {% if dist > 15 %}
      TC_RAISE MSG="Test aborted: toolhead is {dist|round(1)}mm from the saved dock position of {tool.name}. Jog closer first."
    {% else %}
      _TOOL_ALIGN_TEST_RUN X={x} Y={y} Z={z}
    {% endif %}
  {% endif %}

[gcode_macro _TOOL_ALIGN_TEST_RUN]
gcode:
  {% set tool = printer[printer.toolchanger.tool] %}
  {% set x = params.X|float %}
  {% set y = params.Y|float %}
  {% set z = params.Z|float %}
  SET_TOOL_PARAMETER PARAMETER='params_park_x' VALUE={x}
  SET_TOOL_PARAMETER PARAMETER='params_park_y' VALUE={y}
  SET_TOOL_PARAMETER PARAMETER='params_park_z' VALUE={z}
  RESPOND MSG="Testing {tool.name} with park X{x} Y{y} Z{z}"
  # The tool is seated in the dock: leave along the pickup path first so the
  # dropoff starts outside the dock.
  _TC_LEAVE_DOCK T={tool.tool_number} X={x} Y={y} Z={z}
  TEST_TOOL_DOCKING RESTORE_AXIS=XYZ
  VERIFY_TOOL_DETECTED T={tool.tool_number}
  RESPOND MSG="{tool.name} dock test passed at park X{x} Y{y} Z{z}"

[gcode_macro _TC_LEAVE_DOCK]
description: T=<n> X Y Z = the seated point; follow tool T's pickup path from there out of the dock
gcode:
  {% set t = printer['tool T' ~ params.T] %}
  {% set x = params.X|float %}
  {% set y = params.Y|float %}
  {% set z = params.Z|float %}
  {% set ns = namespace(after=False) %}
  G90
  {% for p in t.params_pickup_path %}
    {% if ns.after %}
      G0 X{x + p.get('x', 0)|float} Y{y + p.get('y', 0)|float} Z{z + p.get('z', 0)|float} F{t.params_path_speed|float * p.get('f', 1.0)|float}
    {% endif %}
    {% if p.get('x', 0)|float == 0 and p.get('y', 0)|float == 0 and p.get('z', 0)|float == 0 %}
      {% set ns.after = True %}
    {% endif %}
  {% endfor %}

[gcode_macro _TC_LEAVE_IF_SEATED]
description: If the active tool sits in its dock (2mm in front of park Y or further in), leave along the pickup path
gcode:
  {% set tool = printer[printer.toolchanger.tool] if printer.toolchanger.tool else {} %}
  {% if tool %}
    {% set pos = printer.toolhead.position %}
    {% set o = printer.gcode_move.homing_origin %}
    {% set x = pos.x - o.x %}
    {% set y = pos.y - o.y %}
    {% set z = pos.z - o.z %}
    {% set px = params.PARK_X|default(tool.params_park_x)|float %}
    {% set py = params.PARK_Y|default(tool.params_park_y)|float %}
    {% set pz = params.PARK_Z|default(tool.params_park_z)|float %}
    {% if (x - px)|abs < 16 and y - py < 2.0 and (z - pz)|abs < 3.0 %}
      RESPOND MSG="{tool.name} is seated in its dock: leaving along the pickup path"
      _TC_LEAVE_DOCK T={tool.tool_number} X={x} Y={y} Z={z}
    {% endif %}
  {% endif %}

[gcode_macro TC_ALIGN_ENTER]
description: (alignment) slide the active tool slowly along its dock path into the saved dock position
gcode:
  {% set tool = printer[printer.toolchanger.tool] if printer.toolchanger.tool else {} %}
  {% if printer.toolchanger.status != 'changing' or not tool %}
    TC_RAISE MSG="Run TOOL_ALIGN_START first"
  {% else %}
    {% set x = tool.params_park_x|float %}
    {% set y = tool.params_park_y|float %}
    {% set z = tool.params_park_z|float %}
    {% set ns = namespace(done=False) %}
    G90
    {% for p in tool.params_dropoff_path %}
      {% if not ns.done %}
        {% set seat = p.get('x', 0)|float == 0 and p.get('y', 0)|float == 0 and p.get('z', 0)|float == 0 %}
        G0 X{x + p.get('x', 0)|float} Y{y + p.get('y', 0)|float} Z{z + p.get('z', 0)|float} F{150 if seat else 300}
        {% if seat %}
          {% set ns.done = True %}
        {% endif %}
      {% endif %}
    {% endfor %}
    M400
    RESPOND MSG="{tool.name} is at its saved dock position X{x} Y{y} Z{z}"
  {% endif %}

[gcode_macro TC_ALIGN_NUDGE]
description: (alignment / pickup check) AXIS=X|Y|Z DIST=<mm, max 5> [T=n] slow relative move in docking mode
gcode:
  {% set tn = params.T|default(printer.toolchanger.tool_number)|int %}
  {% set tool = printer['tool T' ~ tn] if tn in printer.toolchanger.tool_numbers else {} %}
  {% set axis = params.AXIS|default('')|upper %}
  {% set dist = params.DIST|default(0)|float %}
  {% if printer.toolchanger.status != 'changing' or not tool %}
    TC_RAISE MSG="Run TOOL_ALIGN_START or TC_PICKUP_CHECK_START first"
  {% elif axis not in ['X', 'Y', 'Z'] or dist|abs > 5.0 %}
    TC_RAISE MSG="TC_ALIGN_NUDGE needs AXIS=X, Y or Z and DIST between -5 and 5"
  {% else %}
    {% set pos = printer.toolhead.position %}
    {% set o = printer.gcode_move.homing_origin %}
    {% set i = {'X': 0, 'Y': 1, 'Z': 2}[axis] %}
    {% set park = [tool.params_park_x|float, tool.params_park_y|float, tool.params_park_z|float] %}
    {% set target = pos[i] - o[i] + dist %}
    {% if (target - park[i])|abs > 15.0 %}
      TC_RAISE MSG="Refusing: that would put {axis} more than 15mm from the saved dock position"
    {% else %}
      G90
      G0 {axis}{target} F{120 if axis != 'Z' else 60}
      M400
    {% endif %}
  {% endif %}

[gcode_macro TC_ALIGN_GOTO]
description: (pickup check) Z=<abs> [T=n] slow absolute Z move in docking mode, within 15mm of the dock height
gcode:
  {% set tn = params.T|default(printer.toolchanger.tool_number)|int %}
  {% set tool = printer['tool T' ~ tn] if tn in printer.toolchanger.tool_numbers else {} %}
  {% set z = params.Z|default(-999)|float %}
  {% if printer.toolchanger.status != 'changing' or not tool %}
    TC_RAISE MSG="Run TC_PICKUP_CHECK_START first"
  {% elif (z - tool.params_park_z|float)|abs > 15.0 %}
    TC_RAISE MSG="Refusing: Z{z} is more than 15mm from the saved dock height"
  {% else %}
    G90
    G0 Z{z} F60
    M400
  {% endif %}

# -----------------------------------------------------------------------------
#  Pickup check: with an EMPTY gantry, approach a docked tool from below and
#  find the X/Y/Z where the gantry fully latches it.
#    TC_PICKUP_CHECK_START T=n       - under the tool, 2 mm below its dock height
#    TC_ALIGN_NUDGE T=n AXIS= DIST=  - adjust (slow)
#    TC_PICKUP_CHECK_FINISH T=n      - use this position, leave the dock with
#                                      the tool along the pickup path, re-detect
#    TC_PICKUP_CHECK_ABORT T=n       - drop back down and out, like a dropoff
# -----------------------------------------------------------------------------
[gcode_macro TC_PICKUP_CHECK_START]
description: T=<n> move the EMPTY gantry under tool T and stop 2 mm below its dock height
gcode:
  TC_DETECT
  _TC_PICKUP_CHECK_START_2 {rawparams}

[gcode_macro _TC_PICKUP_CHECK_START_2]
gcode:
  {% set tn = params.T|default(-1)|int %}
  {% if tn not in printer.toolchanger.tool_numbers %}
    TC_RAISE MSG="TC_PICKUP_CHECK_START needs a tool number, e.g. TC_PICKUP_CHECK_START T=1"
  {% elif printer.toolhead.homed_axes != 'xyz' %}
    TC_RAISE MSG="Home the printer first"
  {% elif printer.toolchanger_ui.detected_tool|int != -1 %}
    TC_RAISE MSG="The gantry must be empty: T{printer.toolchanger_ui.detected_tool} is on it. Drop it off first."
  {% elif printer.toolchanger.status == 'changing' %}
    TC_RAISE MSG="A tool change or alignment is in progress; finish or cancel it first"
  {% else %}
    _TC_PICKUP_CHECK_START_3 T={tn}
  {% endif %}

[gcode_macro _TC_PICKUP_CHECK_START_3]
gcode:
  {% set tn = params.T|int %}
  {% set t = printer['tool T' ~ tn] %}
  {% set p0 = t.params_pickup_path[0] %}
  {% set p1 = t.params_pickup_path[1] %}
  {% set x = t.params_park_x|float %}
  {% set y = t.params_park_y|float %}
  {% set z = t.params_park_z|float %}
  {% if printer.toolchanger.status != 'ready' %}
    TC_RECOVER
  {% endif %}
  ENTER_DOCKING_MODE
  G90
  G0 Y{t.params_safe_y} F{t.params_fast_speed}
  G0 X{x + p0.get('x', 0)|float} Z{z + p0.get('z', 0)|float} F{t.params_fast_speed}
  G0 Y{y + p0.get('y', 0)|float} F3000
  G0 X{x + p1.get('x', 0)|float} Y{y + p1.get('y', 0)|float} Z{z + p1.get('z', 0)|float} F300
  G0 Z{z - 2.0} F120
  M400
  RESPOND MSG="Empty gantry under T{tn}, 2 mm below its dock height (Z{z - 2.0})"

[gcode_macro TC_PICKUP_CHECK_FINISH]
description: T=<n> the gantry is fully latched onto tool T: use this position as its dock position and finish the pickup
gcode:
  {% set tn = params.T|default(-1)|int %}
  {% if printer.toolchanger.status != 'changing' or tn not in printer.toolchanger.tool_numbers %}
    TC_RAISE MSG="Run TC_PICKUP_CHECK_START first"
  {% else %}
    {% set pos = printer.toolhead.position %}
    {% set o = printer.gcode_move.homing_origin %}
    {% set x = (pos.x - o.x)|round(3) %}
    {% set y = (pos.y - o.y)|round(3) %}
    {% set z = (pos.z - o.z)|round(3) %}
    SET_TOOL_PARAMETER T={tn} PARAMETER=params_park_x VALUE={x}
    SET_TOOL_PARAMETER T={tn} PARAMETER=params_park_y VALUE={y}
    SET_TOOL_PARAMETER T={tn} PARAMETER=params_park_z VALUE={z}
    _TC_LEAVE_DOCK T={tn} X={x} Y={y} Z={z}
    M400
    G4 P300
    EXIT_DOCKING_MODE
    TC_RECOVER
    RESPOND MSG="T{tn} dock position set to X{x} Y{y} Z{z} (live)"
  {% endif %}

[gcode_macro TC_PICKUP_CHECK_ABORT]
description: T=<n> leave tool T in its dock: drop the gantry away and move out, like a dropoff
gcode:
  {% set tn = params.T|default(-1)|int %}
  {% if tn in printer.toolchanger.tool_numbers %}
    _TC_BACK_OUT T={tn}
  {% endif %}
  _TC_PICKUP_CHECK_ABORT_2

[gcode_macro _TC_PICKUP_CHECK_ABORT_2]
gcode:
  {% if printer.toolchanger.status == 'changing' %}
    EXIT_DOCKING_MODE
  {% endif %}
  TC_RECOVER

[gcode_macro TOOL_ALIGN_DONE]
gcode:
  {% set tool = printer[printer.toolchanger.tool] %}
  RESET_TOOL_PARAMETER PARAMETER='params_path_speed'
  _TC_REAPPLY_TEST_SPEED
  {% if params.PERSIST|default(0)|int == 1 %}
    SAVE_TOOL_PARAMETER PARAMETER='params_park_x'
    SAVE_TOOL_PARAMETER PARAMETER='params_park_y'
    SAVE_TOOL_PARAMETER PARAMETER='params_park_z'
  {% endif %}
  # Never pull straight out of a dock the tool is seated in
  _TC_LEAVE_IF_SEATED
  _TC_ALIGN_FINISH_MOVE
  RESPOND MSG="{tool.name} park position X{tool.params_park_x} Y{tool.params_park_y} Z{tool.params_park_z} (live until restart - save it from the toolchanger UI)"

[gcode_macro _TC_ALIGN_FINISH_MOVE]
gcode:
  {% set tool = printer[printer.toolchanger.tool] %}
  G90
  G0 Y{tool.params_safe_y} F{tool.params_fast_speed}
  {% if printer.toolchanger.status == 'changing' %}
    EXIT_DOCKING_MODE
  {% endif %}

[gcode_macro _TC_REAPPLY_TEST_SPEED]
description: Alignment resets the active tool's path speed; keep test mode's slow speed if it is on
gcode:
  {% set s = printer["gcode_macro _TC_SAFETY"] %}
  {% if s.test_mode %}
    SET_TOOL_PARAMETER PARAMETER=params_path_speed VALUE={printer.toolchanger.params_path_speed|float * s.test_speed_factor|float}
  {% endif %}

[gcode_macro TOOL_ALIGN_CANCEL]
gcode:
  {% set tool = printer[printer.toolchanger.tool] %}
  # Seated check uses the park position being cancelled (rendered before the resets run)
  _TC_LEAVE_IF_SEATED PARK_X={tool.params_park_x} PARK_Y={tool.params_park_y} PARK_Z={tool.params_park_z}
  RESET_TOOL_PARAMETER PARAMETER='params_path_speed'
  _TC_REAPPLY_TEST_SPEED
  RESET_TOOL_PARAMETER PARAMETER='params_park_x'
  RESET_TOOL_PARAMETER PARAMETER='params_park_y'
  RESET_TOOL_PARAMETER PARAMETER='params_park_z'
  _TC_ALIGN_FINISH_MOVE

# -----------------------------------------------------------------------------
#  RESUME: verify the tool first, then run Mainsail's normal resume.
#  toolchanger.cfg replaces Mainsail's RESUME with a bare RESUME_BASE call,
#  which skips Mainsail's un-retract and temperature restore. This puts that
#  back. Body copied from mainsail-config v1.2.1 (mainsail.cfg).
# -----------------------------------------------------------------------------
[gcode_macro RESUME]
gcode:
  INITIALIZE_TOOLCHANGER
  VERIFY_TOOL_DETECTED
  _TC_MAINSAIL_RESUME {rawparams}

[gcode_macro _TC_MAINSAIL_RESUME]
gcode:
  {% set r = printer['gcode_macro RESUME'] %}
  {% if 'last_extruder_temp' not in r %}
    # No Mainsail macros (mainsail.cfg) on this printer: plain resume
    RESUME_BASE {rawparams}
  {% else %}
  {% set last_extruder_temp = r.last_extruder_temp %}
  {% set restore_idle_timeout = r.restore_idle_timeout %}
  {% set idle_state = r.idle_state %}
  {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
  {% set velocity = printer.configfile.settings.pause_resume.recover_velocity %}
  {% set sp_move = client.speed_move|default(velocity) %}
  {% set runout_resume = True if client.runout_sensor|default("") == ""
                    else True if not printer[client.runout_sensor].enabled
                    else printer[client.runout_sensor].filament_detected %}
  {% set can_extrude = True if printer.toolhead.extruder == ''
                  else printer[printer.toolhead.extruder].can_extrude %}
  {% set do_resume = False %}
  {% set prompt_txt = [] %}
  {% if printer.idle_timeout.state|upper == "IDLE" or idle_state %}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=idle_state VALUE=False
    {% if last_extruder_temp.restore %}
      RESPOND TYPE=echo MSG='{"Restoring \"%s\" temperature to %3.1f°C, this may take some time" % (printer.toolhead.extruder, last_extruder_temp.temp) }'
      M109 S{last_extruder_temp.temp}
      {% set do_resume = True %}
    {% elif can_extrude %}
      {% set do_resume = True %}
    {% else %}
      RESPOND TYPE=error MSG='{"Resume aborted !!! \"%s\" not hot enough, please heat up again and press RESUME" % printer.toolhead.extruder}'
      {% set _d = prompt_txt.append("\"%s\" not hot enough, please heat up again and press RESUME" % printer.toolhead.extruder) %}
    {% endif %}
  {% elif can_extrude %}
    {% set do_resume = True %}
  {% else %}
    RESPOND TYPE=error MSG='{"Resume aborted !!! \"%s\" not hot enough, please heat up again and press RESUME" % printer.toolhead.extruder}'
    {% set _d = prompt_txt.append("\"%s\" not hot enough, please heat up again and press RESUME" % printer.toolhead.extruder) %}
  {% endif %}
  {% if runout_resume %}
    {% if do_resume %}
      {% if restore_idle_timeout > 0 %} SET_IDLE_TIMEOUT TIMEOUT={restore_idle_timeout} {% endif %}
      {client.user_resume_macro|default("")}
      _CLIENT_EXTRUDE
      RESUME_BASE VELOCITY={params.VELOCITY|default(sp_move)}
    {% endif %}
  {% else %}
    RESPOND TYPE=error MSG='{"Resume aborted !!! \"%s\" detects no filament, please load filament and press RESUME" % (client.runout_sensor.split(" "))[1]}'
    {% set _d = prompt_txt.append("\"%s\" detects no filament, please load filament and press RESUME" % (client.runout_sensor.split(" "))[1]) %}
  {% endif %}
  {% if not (runout_resume and do_resume) %}
    RESPOND TYPE=command MSG="action:prompt_begin RESUME aborted !!!"
    {% for element in prompt_txt %}
      RESPOND TYPE=command MSG='{"action:prompt_text %s" % element}'
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_footer_button Ok|RESPOND TYPE=command MSG=action:prompt_end|info"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}
  {% endif %}
