# klipper-toolchanger-ui: served at /toolchanger/ next to Mainsail.
# Included from the Mainsail server block (/etc/nginx/sites-available/mainsail).
location /toolchanger/ {
    alias /home/pi/klipper-toolchanger-ui/web/dist/;
    index index.html;
}
location = /toolchanger/index.html {
    alias /home/pi/klipper-toolchanger-ui/web/dist/index.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
}
